# Deploy OrbitWatch as a static site to GitHub Pages (Phase 9.4 deploy + 9.5 robot job).
#
# The site is a snapshot-driven static export: the browser propagates every
# satellite client-side (satellite.js) from one cached `snapshot.json`, so there
# are zero upstream calls per visit. This workflow publishes `frontend/` to Pages
# and injects the domain-restricted Cesium Ion token from a repo secret.
#
# Two modes, because the conjunction screen is the expensive part:
#   • REUSE (default, ~1 min) — redeploy the site while keeping the snapshot
#     that's already live. This is what a frontend/CSS/JS change wants: no need
#     to re-fetch + re-screen the catalog just to ship a UI tweak.
#   • REBUILD — build the C++ SGP4 extension, fetch the active catalog, screen
#     the FULL ~16k catalog with the Phase-10 accelerated engine, and bake a
#     fresh snapshot. Triggered by the `schedule:` cron below (the Phase 9.5
#     robot job, ~10 min), a manual dispatch with rebuild_snapshot=true, or when
#     there's no snapshot to reuse. Non-cron rebuilds also run the Phase-10.6
#     A/B gate first (accelerated == classic, byte-identical; ~+40 min) — see
#     that step for why cron skips it.
#
# Phase 9.5 — the robot job + archive:
#   • The `schedule:` cron rebuilds 3×/day so the site refreshes itself and
#     upstream (CelesTrak) is hit on a schedule, never per visit. The times
#     trail CelesTrak's SOCRATES runs (it screens the SAME GP catalog we do,
#     3×/day) so each rebuild uses freshly-refreshed elements — see the "Log
#     SOCRATES run time" step, which records SOCRATES's live upload time so the
#     slots can be tuned against the actual observed cadence.
#   • Every rebuild ARCHIVES the fresh snapshot as snapshots/<ISO-ts>.json.gz on
#     an orphan `data` branch (append-only; NEVER merged into main → no history
#     bloat on the code branch). That archive backs the 9.10 evolution view.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      rebuild_snapshot:
        description: "Re-fetch + re-screen the catalog (~8 min). Off = redeploy reusing the live snapshot (~1 min)."
        type: boolean
        default: false
  # The robot job: rebuild the snapshot 3×/day (UTC). Spaced ~8 h; the 13:17 slot
  # trails the confirmed ~12:10 UTC SOCRATES upload by ~1 h, a margin that absorbs
  # both SOCRATES jitter and GitHub cron's best-effort delay. The :17 offset
  # dodges the top-of-hour, which GitHub's docs flag as the most-congested (and
  # most-delayed/-dropped) minute for scheduled jobs. Cheap to run 3×/day because
  # scheduled rebuilds SKIP the A/B gate (see that step) — a cron refresh is
  # ~10 min, only data changes, and the engine is already validated.
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC — after the midday SOCRATES run
    - cron: "17 21 * * *"   # 21:17 UTC
    - cron: "17 5 * * *"    # 05:17 UTC
  push:
    branches: [main]
    # Only the deployed site + this workflow. A push here REUSES the live
    # snapshot (fast) — data refreshes come from a manual rebuild or the cron.
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

# Least privilege by default: read-only contents. Only the `build` job bumps
# `contents: write` (for the archive push to the `data` branch) — the `deploy`
# job inherits this read-only set, since it only needs pages/id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

# The snapshot that's currently live — reused unless we're rebuilding.
env:
  LIVE_SNAPSHOT_URL: https://jtemblador.github.io/OrbitWatch/snapshot.json

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level override: this job (and only this job) needs `contents: write` for
    # the archive push. Job permissions REPLACE the top-level set, so pages/
    # id-token are re-listed (configure-pages / upload-pages-artifact need them).
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Decide reuse vs rebuild. Reuse = download the live snapshot into
      # frontend/. If that fetch fails (e.g. the very first deploy, before any
      # snapshot exists), fall back to a full rebuild so we never ship an empty
      # site. `rebuild` output gates the heavy Python/C++ steps below.
      - name: Decide snapshot source
        id: decide
        run: |
          REBUILD=false
          # The scheduled robot job (Phase 9.5) always rebuilds — that's its job:
          # re-fetch + re-screen so the site stays fresh and upstream is hit on a
          # schedule, not per visit.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REBUILD=true
            echo "Rebuild forced (scheduled robot job)."
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.rebuild_snapshot }}" = "true" ]; then
            REBUILD=true
            echo "Rebuild requested (manual dispatch)."
          fi
          if [ "$REBUILD" = "false" ]; then
            if curl -fsSL -o frontend/snapshot.json "$LIVE_SNAPSHOT_URL"; then
              echo "Reusing live snapshot ($(wc -c < frontend/snapshot.json) bytes) — no re-screen."
            else
              echo "::warning::No live snapshot to reuse — forcing a rebuild."
              rm -f frontend/snapshot.json
              REBUILD=true
            fi
          fi
          echo "rebuild=$REBUILD" >> "$GITHUB_OUTPUT"

      # Record when CelesTrak last uploaded a SOCRATES run vs. when this rebuild
      # started. SOCRATES screens the same GP catalog we do (3×/day), so its
      # upload time is a proxy for "the elements just refreshed." Reading this
      # across the first few days shows SOCRATES's actual morning/evening upload
      # times so the cron slots above can be tuned to trail them precisely.
      - name: Log SOCRATES run time (schedule alignment check)
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          LM=$(curl -fsSI --max-time 30 https://celestrak.org/SOCRATES/sort-minRange.csv 2>/dev/null \
               | grep -i '^last-modified:' | sed 's/[^:]*: //' | tr -d '\r' || true)
          echo "SOCRATES sort-minRange.csv last uploaded: ${LM:-unknown}"
          echo "This rebuild started at:                  $(date -u '+%a, %d %b %Y %H:%M:%S GMT')"

      - name: Set up Python 3.12
        if: steps.decide.outputs.rebuild == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (+ pybind11 for the C++ build)
        if: steps.decide.outputs.rebuild == 'true'
        run: pip install -r requirements.txt pybind11

      # Build the pybind11 SGP4 module and drop the .so where the screen imports
      # it (backend/). pybind11's CMake config ships with the pip package.
      - name: Build the C++ SGP4 extension
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          cd orbitcore
          mkdir -p build && cd build
          cmake -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" ..
          make -j"$(nproc)"
          cp orbitcore*.so ../../backend/

      # Populate the active-catalog cache ONCE so the A/B gate and the snapshot
      # build below screen the identical elements (build_snapshot reuses this
      # <2 h cache instead of re-fetching).
      - name: Fetch active catalog
        if: steps.decide.outputs.rebuild == 'true'
        run: python -c "from backend.core.tle_fetcher import GPFetcher; d=GPFetcher().fetch('active'); print(f'fetched {len(d)} active objects')"

      # Phase-10.6 CI gate: the accelerated engine (fused C++ + time sieve + C++
      # fine stage) MUST produce byte-identical conjunction events to the classic
      # cascade, or this step exits non-zero and the whole build fails → the
      # `deploy` job (needs: build) never runs, so a wrong snapshot never ships.
      # Two tiers, both on the just-fetched cache:
      #   • Tier 1 — the COMPLETE contract (classic == fused+sieve+refine) at a
      #     bounded scale where the classic path fits in memory (~3 min).
      #   • Tier 2 — the FULL-catalog sieve check where classic can't run (it
      #     would re-materialize the multi-GB Python pair list + fine dicts Phase
      #     10 removed): fused+refine (sieve OFF) vs fused+sieve+refine isolates
      #     the sieve's event-level no-skip on the real full catalog — the one
      #     thing offline tests can't construct. Both sides keep the C++ fine
      #     pre-cut, so both stay memory-safe. Run at a 6 h window: the no-skip
      #     risk is node-crossing GEOMETRY (window-length-independent), so 6 h
      #     exercises every pair's node line over the whole catalog while keeping
      #     the sieve-OFF medium scan (~9 min) affordable for a 3x/day cron; the
      #     24 h production window's fidelity is covered by Tier 1.
      # ab_screen.py exits 0 iff the event lists match; `set -e` fails the step.
      #
      # SKIPPED on scheduled (cron) rebuilds: the gate re-runs the OLD slow
      # cascade as the reference (~40 min on the 4-vCPU runner — measured
      # 2026-07-15: Tier 1 ~8 min + Tier 2 ~31 min), which tripled the robot
      # job for a check that only guards CODE changes, not data refreshes. The
      # engine's identity is already proven offline (583 tests incl. mutation-
      # checked flip locks), across 4 catalogs (10.3), and in CI on live data
      # (this gate, 2026-07-15: 308==308, 3,887==3,887).
      #
      # Engine/backend CODE changes are gated at PUSH time by a dedicated
      # workflow, .github/workflows/ci.yml (pytest + this same two-tier A/B gate
      # on live data), because deploy.yml's `push` trigger only fires on
      # frontend/** and a push here REUSES the live snapshot (no rebuild → this
      # step never runs). So by the time the cron rebuilds with new engine code,
      # ci.yml has already proven it byte-identical — which is what makes the
      # cron's gate-skip safe. This step still runs the FULL gate on every manual
      # dispatch (rebuild_snapshot=true) and any first-deploy rebuild fallback,
      # as a belt-and-suspenders check right before a real deploy.
      - name: A/B gate — accelerated screen == classic (byte-identical events)
        if: steps.decide.outputs.rebuild == 'true' && github.event_name != 'schedule'
        run: |
          set -e
          echo "::group::Tier 1 — classic vs fused+sieve+refine (5000 sats, 24 h)"
          python scripts/ab_screen.py --source active --mode sfs \
            --baseline classic --refine --max-sats 5000 --hours 24 --step 30 \
            --min-objects 8000
          echo "::endgroup::"
          echo "::group::Tier 2 — fused+refine vs fused+sieve+refine (full catalog, 6 h)"
          python scripts/ab_screen.py --source active --mode sfs \
            --baseline fused --refine --hours 6 --step 30 --min-objects 8000
          echo "::endgroup::"

      # Fetch (cache hit from the step above) + run the real SFS screen + write
      # frontend/snapshot.json (screens only handbook-covered orbits).
      #
      # Phase 10.6 lifted the cap: build_snapshot now runs the accelerated engine
      # (fused C++ + sieve + C++ fine stage — gated byte-identical above), so the
      # FULL active catalog (~16k, ~12k screenable) fits the runner. Measured
      # locally: 16k / 24 h = ~5 min / 5.4 GB / 1.3 MB gz. Expect ~1.5–2× slower on
      # the shared 4-vCPU runner, still well within the job budget. Display ==
      # screen (both the whole catalog), so "fully screened" stays honest.
      # --hours 24: a standard conjunction horizon; 72 h is ~3× the compute.
      # --min-objects 8000: refuse to publish if the fetch came back truncated
      # (a valid-but-partial upstream response is non-empty, so this floor — not
      # the empty-check — is what catches it). This is the last guard on the cron
      # path, which skips the A/B gate above. The real active catalog is ~16k.
      - name: Build snapshot.json (fetch active + screen offline)
        if: steps.decide.outputs.rebuild == 'true'
        run: python scripts/build_snapshot.py --group active --hours 24 --min-objects 8000

      # Archive the fresh snapshot to the `data` branch as
      # snapshots/<ISO-ts>.json.gz (append-only). The `data` branch is an ORPHAN
      # (no shared history with main) so the growing archive never bloats the
      # code branch. Done in a linked git worktree under $RUNNER_TEMP so the main
      # checkout's frontend/ (uploaded to Pages below) is untouched. The pushed
      # snapshot.json goes live via the normal Pages deploy — this is the durable
      # record of what each run published (backs the 9.10 evolution view).
      #
      # The top-level `concurrency: pages` group serializes in-progress runs, so
      # two archive pushes never overlap (a queued run can still be superseded —
      # that just skips one refresh cycle, harmless).
      #
      # continue-on-error: the archive is a SECONDARY record (backs the 9.10
      # evolution view). The PRIMARY goal is refreshing the live site, so a
      # transient git/network failure here must NOT block the deploy of a
      # perfectly good snapshot. On failure the job keeps going (site still
      # ships) and the next step annotates a visible warning; the next scheduled
      # run retries the archive.
      - name: Archive snapshot to the data branch
        id: archive
        if: steps.decide.outputs.rebuild == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Windows-safe ISO timestamp from the snapshot's own generated_at
          # (colons -> dashes so the filename is portable).
          TS=$(python -c "import json; print(json.load(open('frontend/snapshot.json'))['meta']['generated_at'].replace(':','-'))")
          echo "Archiving snapshot $TS to the data branch."

          git config user.name  "orbitwatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Does the `data` branch already exist on the remote? `ls-remote
          # --exit-code` returns 0 = found, 2 = query OK but no such ref, and
          # anything else = a real error (network/auth). We MUST NOT treat that
          # error as "first run" — that would create a bogus orphan and the
          # no-force push would be rejected as non-fast-forward. So fail loudly.
          # Capture stderr (discard the ref list on stdout) so the abort path
          # below can report WHY ls-remote failed, not just the exit code.
          set +e
          err=$(git ls-remote --exit-code --heads origin data 2>&1 >/dev/null)
          rc=$?
          set -e

          WT="$RUNNER_TEMP/data-wt"
          if [ "$rc" -eq 0 ]; then
            # Extend the existing archive. Base the worktree on FETCH_HEAD, not
            # origin/data: checkout@v4's narrow refspec doesn't create a
            # refs/remotes/origin/data tracking ref, but a fetch of an explicit
            # ref always sets FETCH_HEAD (verified locally).
            git fetch --depth=1 origin data
            git worktree add -B data "$WT" FETCH_HEAD
          elif [ "$rc" -eq 2 ]; then
            # First run: create the orphan `data` branch (detach + checkout
            # --orphan is portable across git versions; `worktree add --orphan`
            # only exists on newer git).
            echo "First archive run — creating the orphan data branch."
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan data
            git -C "$WT" rm -rf --quiet . 2>/dev/null || true
          else
            echo "::error::git ls-remote failed (exit $rc): ${err:-no stderr} — aborting so a transient error can't overwrite the archive with a bogus orphan."
            exit 1
          fi

          mkdir -p "$WT/snapshots"
          gzip -c frontend/snapshot.json > "$WT/snapshots/${TS}.json.gz"
          git -C "$WT" add "snapshots/${TS}.json.gz"
          git -C "$WT" commit -q -m "Archive snapshot ${TS}"
          git -C "$WT" push origin data
          git worktree remove --force "$WT"
          echo "Archived snapshots/${TS}.json.gz ($(gzip -c frontend/snapshot.json | wc -c) bytes gz)."

      # Surface an archive failure loudly WITHOUT failing the run (the site still
      # shipped). continue-on-error masks the red X, so annotate a warning that's
      # visible on the run summary; the next scheduled run retries the archive.
      - name: Warn if the snapshot archive failed
        if: steps.archive.outcome == 'failure'
        run: |
          echo "::warning::Snapshot archive to the data branch FAILED this run — the live site still refreshed (the archive is a secondary record). See the 'Archive snapshot to the data branch' step log; the next scheduled run will retry."

      # Inject the Ion token from the repo secret into the gitignored config.js.
      # Passed via env (not string-interpolated into the script) so a token with
      # shell metacharacters can't break out. GitHub masks the value in logs.
      - name: Inject Cesium Ion token
        env:
          ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          if [ -z "$ION_TOKEN" ]; then
            echo "::error::CESIUM_ION_TOKEN secret is empty — set it in repo Settings → Secrets → Actions."
            exit 1
          fi
          printf 'const CESIUM_ION_TOKEN = "%s";\n' "$ION_TOKEN" > frontend/js/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
